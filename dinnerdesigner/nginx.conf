server {
    listen 8099;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must always be revalidated so updates are picked up promptly;
    # hashed asset filenames can be cached aggressively.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cross-device sync API, served by the small Node backend in server/index.js
    # (listens on 127.0.0.1:8100, never exposed directly). No path suffix after
    # the backend host:port below, so the full /api/state URI passes through
    # unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # No client-side router today, but this is a harmless, future-proof SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
